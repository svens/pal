# Cluster shape and run defaults, included by azure/common.cmake.
#
# Every value is overridable per invocation; README.md, Quickstart, has the form.

default(location northeurope)

# Every action operates on this group alone; 'stop' and 'deallocate' hit every VM
# they find in it.
default(resource_group "${admin_user}-loadtest")

# Deployment name, so repeated deploys are one traceable history in the portal.
default(deployment_name pal-loadtest)

default(relay_size Standard_F4s_v2)
default(client_size Standard_F2s_v2)
default(client_count 8)

# UDP ranges opened towards the relay.
#
#   client_ports  the well-known ports the samples bind: the client-facing one
#                 and, for the mturn relay, the shared peer-facing one
#   peer_ports    opened towards the relay for per-session peer sockets, but not
#                 passed to it: a turn-mode relay needs the range restated in
#                 relay_args as --peer.ports
default(client_ports 3478-3479)
default(peer_ports 40000-65535)

# Arguments the relay is started with, in cmake list format. Empty is the sample's
# own defaults.
default(relay_args "")

# ON gives each sweep rung an empty relay. OFF keeps one instance for the whole
# ladder, which measures what the never-evicted client map costs as sessions from
# earlier rungs pile up.
default(relay_restart ON)

# 'run' defaults. Each client VM runs one loadtest process, so total sessions is
# client_count * streams. kbps and payload are the audio profile; docs/measure.md,
# Traffic profiles, has the video and bundled pairings.
default(streams 100)
default(kbps 48)
default(payload 120)

# Seconds excluded from 'runtime' and from the counter window. It grows with
# session count, so re-check it at the top rung of each ladder.
default(warmup 15)

# Measured window in seconds: a run takes warmup + runtime.
default(runtime 60)

# Thresholds loadtest exits nonzero on, which is what 'sweep' uses as its oracle.
default(max_loss 1)
default(max_rtt_ms 10)

# Ladder bounds, each streams per client like 'run': a rung is
# client_count * streams sessions.
default(sweep_start 100)
default(sweep_step 100)
default(sweep_max 2000)

# 'profile' capture; see docs/profile.md
#
#   profile_streams    streams per client
#   profile_seconds    sampled window, which runs inside the one 'runtime' bounds
#   profile_freq       samples per second per CPU
#   profile_conntrack  the state the relay is asserted to be in
default(profile_streams 575)
default(profile_relay_args "--threads=1 --mode=mturn")
default(profile_seconds 30)
default(profile_freq 99)
default(profile_conntrack OFF)
default(profile_dir "${loadtest_dir}/.profile")
