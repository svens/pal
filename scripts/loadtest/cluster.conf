# Cluster shape and run defaults.
#
# Included by azure/common.cmake. Every value goes through default(), so any of
# them can be overridden per invocation without editing this file:
#
#     cmake -Dclient_count=2 -P azure/deploy.cmake
#
# Ninja cannot forward variables, so 'ninja <target>' always uses what is here.

# Azure region. Everything lands in one region: cross-region latency would
# swamp the differences we are trying to measure.
default(location northeurope)

# Resource group. Every action operates on exactly this group and nothing else
# in it is expected, so keep it dedicated -- 'stop' and 'deallocate' hit every
# VM they find there.
default(resource_group "${admin_user}-loadtest")

# Deployment name, so repeated deploys are one traceable history in the portal
# rather than a pile of generated names.
default(deployment_name pal-loadtest)

# Relay VM size. A relay is bound by per-packet cost, so clock speed matters
# more than core count, which is what the F family is for.
default(relay_size Standard_F4s_v2)

# Loadtest client VM size and count. Clients are deliberately small and
# unpinned; to generate more load add VMs or processes, not vCPUs.
default(client_size Standard_F2s_v2)
default(client_count 4)

# The Windows relay stays in the template but is not deployed by default: the
# IOCP socket backend is not done yet.
default(deploy_relay_windows OFF)

# UDP ranges opened towards the relay.
#
#   client_ports  the two well-known ports the samples bind by default -- the
#                 client-facing one and, for the mturn relay, the single shared
#                 peer-facing one
#   peer_ports    the range an IETF TURN-style relay allocates a per-session peer
#                 socket from, which the planned samples/udp_relay_turn needs
default(client_ports 3478-3479)
default(peer_ports 50000-60000)

# Arguments the relay is started with by 'start-relay-<os>' and by 'sweep'.
# Empty means the sample's own defaults; a results row that used anything else
# has to say so. Specify in cmake format, entries separated by semicolon.
default(relay_args "")

# 'sweep' owns the relay: it refuses to start while one is already running, and
# stops the one it started. OFF keeps a single instance for the whole ladder,
# which measures what the relay's never-evicted client map costs as sessions from
# earlier steps pile up.
default(relay_restart ON)

# 'run' defaults. Each client VM runs one loadtest process, so total sessions is
# client_count * streams. kbps and payload are the audio traffic profile; see
# docs/measure.md, 2 Traffic profiles, for that pairing and for the video and
# bundled profiles.
default(streams 100)
default(kbps 48)
default(payload 120)

# Warm-up, in seconds, excluded from 'runtime' and from the counter window. The
# startup transient is what the thresholds would otherwise latch on -- it grows
# with session count, so this is a constant to re-check at the top rung of each
# ladder rather than one that holds across VM sizes. One number for both halves:
# the clients ignore threshold violations before it, the harness snapshots the
# relay counters after it.
default(warmup 10)

# Measured window, in seconds: warm-up is on top, so a run takes warmup+runtime.
default(runtime 60)

# Pass/fail thresholds. loadtest exits nonzero when any reporting interval
# violates one of these, which is the only machine-readable signal it makes --
# and therefore what 'sweep' uses as its oracle.
default(max_loss 1)
default(max_rtt_ms 10)

# 'sweep' ramps streams until the thresholds break or max is achieved. Each of
# the three is streams per client, like 'run': a step is client_count * streams
# sessions
default(sweep_start 100)
default(sweep_step 100)
default(sweep_max 2000)
